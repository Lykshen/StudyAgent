name: 测试与打包

# 推送到 main 或手动运行时：先跑测试，再打包 Windows exe 和安卓 APK，
# 最后发布到 Releases 页面的「最新版」，可以直接下载安装。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - run: python tests/test_api.py
      - run: python tests/test_rules.py

  windows:
    name: Windows 程序
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt pywebview pyinstaller
      - name: 打包 StudyAgent.exe
        run: python -m PyInstaller --noconfirm --clean packaging/StudyAgent.spec
      - name: 用打包好的 exe 运行全部参考解
        run: python packaging/check_exe.py dist/StudyAgent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: StudyAgent-windows
          path: dist/StudyAgent.exe

  android:
    name: 安卓 App
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: 生成安卓工程
        run: |
          npm install
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
      - name: 允许连接局域网里的电脑（HTTP）
        run: sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
      - name: 打包 APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../StudyAgent.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StudyAgent-android
          path: StudyAgent.apk

  release:
    name: 发布到 Releases
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: 发布最新版
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/StudyAgent-windows/StudyAgent.exe out/StudyAgent-android/StudyAgent.apk \
            --title "StudyAgent 最新版" \
            --notes "由提交 ${GITHUB_SHA::7} 自动构建。电脑下载 StudyAgent.exe 双击运行；手机下载 StudyAgent.apk 安装。使用说明见 docs/使用手册.md。"
